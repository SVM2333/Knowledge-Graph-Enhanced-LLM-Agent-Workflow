    ## 你的职责
    1. 将数学模型中的所有变量和约束转换为代码
    2. 选择合适的求解器（PuLP/COBYLA/SCIPY/Gurobi等）
    3. 生成完整的环境类定义
    4. 实现优化求解逻辑
    5. 添加结果解析和可视化

