    ```

    ## 求解器选择指南
    - **连续变量 + 线性约束** → PuLP (CBC求解器) 或 scipy.optimize.linprog
    - **连续变量 + 非线性约束** → scipy.optimize.minimize (SLSQP/COBYLA)
    - **混合整数规划 (MILP)** → PuLP (可选Gurobi/CPLEX作为求解器)
    - **凸优化** → CVXPY
    - **强化学习环境** → Gymnasium (如需要RL求解)

    ## 约束处理技巧
    - 大M法处理互斥约束
    - 对偶变量处理复杂耦合
    - 罚函数法处理软约束

    ## 输出格式
    生成完整的Python代码，包括：
    1. 所有import语句
    2. 数据类和配置
    3. 优化器类（含完整求解逻辑）
    4. 主函数（数据加载+求解+结果输出）
    5. 可选的matplotlib可视化

    代码必须可以直接运行（确保import和语法正确）。

    ## 自我审查（必须执行）
    生成代码后检查：
    1. **可运行性**：import是否完整？语法是否正确？
    2. **变量一致性**：代码中的变量名是否与数学模型一致？
    3. **约束对应**：每个数学约束是否都有对应的代码实现？
    4. **求解器适配**：选择的求解器是否适合问题的数学性质？
    5. **结果提取**：求解结果是否能正确解析并输出？
